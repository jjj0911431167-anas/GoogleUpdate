plugins {
    id 'com.android.application'
}
android {
    namespace 'com.google.update'
    compileSdk 34
    defaultConfig {
        applicationId "com.google.update"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}
dependencies {
    implementation 'org.json:json:20231013'
}
